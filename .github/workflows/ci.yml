name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: orchestrator/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -race -timeout 120s

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: orchestrator/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy & health check
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/rootuser/multi-cli
            rm -f orchestrator/frontend/package-lock.json
            git pull origin main
            cd orchestrator/frontend
            npm ci
            npm run build
            cd ..
            go build -o orchestrator ./cmd/orchestrator/
            killall orchestrator 2>/dev/null || true
            sleep 1
            nohup ./start.sh > /tmp/orchestrator.log 2>&1 &
            sleep 5

      - name: Health check
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            for i in $(seq 1 6); do
              STATUS=$(curl -sf http://localhost:8080/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))" 2>/dev/null || echo "down")
              echo "Attempt $i: $STATUS"
              if [ "$STATUS" = "ok" ]; then
                echo "Server healthy"
                exit 0
              fi
              sleep 5
            done
            echo "Server did not come up"
            exit 1
