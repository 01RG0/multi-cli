    description: "kilo run — auto free mode, own built-in quota"

  - name: kilocode
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/kilocode
    description: "kilocode run — auto free mode, multi-file synthesis"

  - name: vibe
