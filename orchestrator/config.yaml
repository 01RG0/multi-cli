providers:
  - name: groq
    type: openai_compat
    base_url: https://api.groq.com/openai
    api_key: ${GROQ_API_KEY}
    model: qwen/qwen3.8-27b

  - name: tokenharbor
    type: openai_compat
    base_url: ${TOKEN_HARBOR_BASE_URL}
    api_key: ${TOKEN_HARBOR_API_KEY}
    model: gpt-4o-mini

  - name: codecraft
    type: openai_compat
    base_url: ${CODECRAFT_BASE_URL}
    api_key: ${CODECRAFT_API_KEY}
    model: gpt-4o-mini

  - name: aihubmix
    type: openai_compat
    base_url: ${AIHUBMIX_BASE_URL}
    api_key: ${AIHUBMIX_API_KEY}
    model: gpt-4o-mini

  - name: apmix
    type: openai_compat
    base_url: https://api.apmix.ai/v1
    api_key: ${APMIX_API_KEY}
    model: gpt-6-luna-free

  - name: dahl
    type: openai_compat
    base_url: https://inference.dahl.global/v1
    api_key: ${DAHL_API_KEY}
    model: deepseek-ai/DeepSeek-V4-Flash-0731

  - name: ollama
    type: openai_compat
    base_url: http://localhost:11434
    api_key: ""
    model: llama3.2

  - name: anthropic
    type: anthropic
    base_url: ""
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-opus-4-5

  - name: bedrock
    type: bedrock
    region: ${AWS_REGION_NAME}
    access_key: ${AWS_ACCESS_KEY_ID}
    secret_key: ${AWS_SECRET_ACCESS_KEY}
    model: us.anthropic.claude-sonnet-4-6-20251001-v1:0

# Primary provider + fallback order
fallback_chain: [apmix, groq, dahl, bedrock, tokenharbor, codecraft, aihubmix, ollama, anthropic]

max_retries: 3
cooldown_seconds: 60

# Proxy server (set port > 0 to enable; then set ANTHROPIC_BASE_URL=http://localhost:8080)
proxy_port: 8080
proxy_log: false

# SQLite database path
db_path: orchestrator.db

# Worker pool concurrency
concurrency: 4

# Memory / knowledge-graph settings
memory_enabled: false       # set to true to inject retrieved context into system prompt
retrieval_k: 5              # max nodes to retrieve per query
core_memory_max_bytes: 4096 # max size of the core memory scratchpad
# Worker pool enabled at startup
enable_workers: true

# Tool sandboxing
tools:
  shell:
    timeout_seconds: 30
    allowed_commands: [git, go, npm, python, node, curl, cat, ls]
    deny_network: true
  web:
    timeout_seconds: 15
    max_response_bytes: 1048576

# Per-agent provider chains — each CLI agent routes through its own ordered list.
# Empty or missing entry falls back to the global fallback_chain.
agent_providers:
  codex:      [apmix, tokenharbor, aihubmix, mistral, dahl]
  cursor:     [apmix, tokenharbor, aihubmix, dashscope, dahl]
  cline:      [apmix, aihubmix, tokenharbor, mistral, dahl]
  opencode:   [apmix, tokenharbor, aihubmix, dashscope, dahl]
  grok:       [apmix, aihubmix, tokenharbor, groq, dahl]
  researcher: [apmix, tokenharbor, aihubmix, cohere, dahl]
  debugger:   [apmix, tokenharbor, aihubmix, groq, dahl]
  vibe:       [apmix, aihubmix, tokenharbor, cerebras, dahl]
  jules:      [apmix, aihubmix, tokenharbor, gemini, dahl]
  agy:        [apmix, aihubmix, tokenharbor, cerebras, dahl]
  kilo:       [apmix, tokenharbor, aihubmix, groq, dahl]
  hermes:     [apmix, tokenharbor, aihubmix, mistral, dahl]
  default:    [apmix, tokenharbor, aihubmix, dashscope, openrouter, dahl, groq, cerebras]

# Available CLI agents
cli_agents:
  - name: hermes
    command: hermes
    description: "Nous Research Hermes agent - deep tool-use, reasoning and autonomous workflows"
  - name: opencode
    command: opencode
    description: "Full-Stack Code Architect & AST Synthesizer"
  - name: codex
    command: codex
    description: "Sandboxed Deterministic Code Execution Engine"
  - name: vibe
    command: vibe
    description: "Rapid UI Prototyping & Hot-Fix Specialist"
  - name: agy
    command: agy
    description: "Antigravity Autonomous Swarm Orchestration Core"
  - name: grok
    command: grok
    description: "Formal Verification, Mathematical Logic & Deep Auditing"
  - name: cline
    command: cline
    description: "Autonomous Agentic Terminal & File System Refactorer"
  - name: kilo
    command: kilo
    description: "Micro-Latency Token Optimizer & Fast Completion"
  - name: cursor
    command: cursor
    description: "Context-Aware Multi-File Code Editor Agent"
  - name: researcher
    command: researcher
    description: "Deep Documentation, Technical Extraction & Web Mining"
  - name: debugger
    command: debugger
    description: "Stacktrace Diagnostics, Root-Cause Isolation & Fixer"
  - name: jules
    command: jules
    description: "Google Jules Async Background Engineering Specialist"
