providers:
  - name: groq
    type: openai_compat
    base_url: https://api.groq.com/openai
    api_key: ${GROQ_API_KEY}
    model: qwen/qwen3.8-27b

  - name: tokenharbor
    type: openai_compat
    base_url: ${TOKEN_HARBOR_BASE_URL}
    api_key: ${TOKEN_HARBOR_API_KEY}
    model: gpt-4o-mini

  - name: codecraft
    type: openai_compat
    base_url: ${CODECRAFT_BASE_URL}
    api_key: ${CODECRAFT_API_KEY}
    model: gpt-4o-mini

  - name: aihubmix
    type: openai_compat
    base_url: ${AIHUBMIX_BASE_URL}
    api_key: ${AIHUBMIX_API_KEY}
    model: gpt-4o-mini

  - name: apmix
    type: openai_compat
    base_url: https://api.apmix.ai/v1
    api_key: ${APMIX_API_KEY}
    model: deepseek-v4-flash-free

  - name: dahl
    type: openai_compat
    base_url: https://inference.dahl.global/v1
    api_key: ${DAHL_API_KEY}
    model: deepseek-ai/DeepSeek-V4-Flash-0731

  - name: ollama
    type: openai_compat
    base_url: http://localhost:11434
    api_key: ""
    model: llama3.2

  - name: anthropic
    type: anthropic
    base_url: ""
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-opus-4-5

  - name: bedrock
    type: bedrock
    region: ${AWS_REGION_NAME}
    access_key: ${AWS_ACCESS_KEY_ID}
    secret_key: ${AWS_SECRET_ACCESS_KEY}
    model: us.anthropic.claude-sonnet-4-6-20251001-v1:0

# Primary provider + fallback order
fallback_chain: [groq, apmix, dahl, bedrock, tokenharbor, codecraft, aihubmix, ollama, anthropic]

max_retries: 3
cooldown_seconds: 60

# Proxy server (set port > 0 to enable; then set ANTHROPIC_BASE_URL=http://localhost:8080)
proxy_port: 8080
proxy_log: false

# SQLite database path
db_path: orchestrator.db

# Worker pool concurrency
concurrency: 4

# Memory / knowledge-graph settings
memory_enabled: false       # set to true to inject retrieved context into system prompt
retrieval_k: 5              # max nodes to retrieve per query
core_memory_max_bytes: 4096 # max size of the core memory scratchpad
# Worker pool and memory enabled at startup
enable_workers: false
memory_enabled: false
retrieval_k: 5
core_memory_max_bytes: 4096

# Tool sandboxing
tools:
  shell:
    timeout_seconds: 30
    allowed_commands: [git, go, npm, python, node, curl, cat, ls]
    deny_network: true
  web:
    timeout_seconds: 15
    max_response_bytes: 1048576

# Per-agent provider chains — each CLI agent routes through its own ordered list.
# Empty or missing entry falls back to the global fallback_chain.
agent_providers:
  codex:      [tokenharbor, aihubmix, mistral, dahl, apmix]
  cursor:     [tokenharbor, aihubmix, dashscope, dahl, apmix]
  cline:      [aihubmix, tokenharbor, mistral, dahl, apmix]
  opencode:   [tokenharbor, aihubmix, dashscope, dahl, apmix]
  grok:       [aihubmix, tokenharbor, groq, dahl, apmix]
  researcher: [tokenharbor, aihubmix, cohere, dahl, apmix]
  debugger:   [tokenharbor, aihubmix, groq, dahl, apmix]
  vibe:       [aihubmix, tokenharbor, cerebras, dahl, apmix]
  jules:      [aihubmix, tokenharbor, gemini, dahl, apmix]
  agy:        [aihubmix, tokenharbor, cerebras, dahl, apmix]
  kilo:       [tokenharbor, aihubmix, groq, dahl, apmix]
  default:    [tokenharbor, aihubmix, dashscope, openrouter, dahl, apmix, groq, cerebras]
