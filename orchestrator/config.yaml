  # and still consumed a slot in the fallback chain. Re-enable only with a real
  # base_url + key (POOLED_BASE_URL serves MiniMax-M3-Official; M2.x is unverified).
  # - name: minimax-m2.7
  #   type: openai_compat
  #   base_url: ${POOLED_BASE_URL}
  #   api_key: ${POOLED_API_KEY}
  #   model: MiniMax-M2.7-Official
  #
  # - name: minimax-m2.5
  #   type: openai_compat
  #   base_url: ${POOLED_BASE_URL}
  #   api_key: ${POOLED_API_KEY}
  #   model: MiniMax-M2.5-Official

  - name: anyapi
    type: openai_compat
    base_url: ${ANYAPI_BASE_URL}
    api_key: ${ANYAPI_API_KEY}
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    # 2026-09-29: reaches the API now (the duplicated "/v1" path was the old
    # problem); currently answers 429 "You are being rate limited" — transient,
    # so it stays at the tail of the chain.

  - name: dashscope
    type: openai_compat
    base_url: ${ALIBABA_BASE_URL}
    api_key: ${ALIBABA_API_KEY}
    model: qwen3.8-max

  - name: gemini
    type: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash

  - name: anthropic
    type: anthropic
    base_url: ""
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-opus-4-5

  # ── Amazon Bedrock: DISABLED 2026-09-29 ────────────────────────────────────
  # Two independent credential paths were tried and both are rejected by AWS:
  #   1. SigV4 with ${AWS_ACCESS_KEY_ID}/${AWS_SECRET_ACCESS_KEY}
  #      -> "The request signature we calculated does not match the signature
  #         you provided" (probe of both entries, 2026-09-29).
  #   2. Bedrock API key (bearer token, BedrockAPIKey-*, us-east-1)
  #      -> HTTP 403 "Please make sure your API Key is valid" on the Converse
  #         and InvokeModel endpoints, for every model tested (Claude 3 Sonnet,
  #         3.5 Sonnet/Haiku, Claude 4 Haiku, Nova Lite/Pro, Llama 3.1 70B,
  #         Mistral Large). The key is likely missing the
  #         bedrock:CallWithBearerToken IAM grant and/or per-model access.
  # Bedrock is optional redundancy here, not a dependency: the remaining 13
  # providers serve all traffic. To re-enable after fixing AWS:
  #   a) Bedrock console -> Model access -> enable a model
  #   b) IAM policy: bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream,
  #      bedrock:CallWithBearerToken on Resource "*"
  #   c) create a long-lived key (30-90 days; 1-day keys expire too fast)
  #   d) uncomment the two blocks below and re-add them to fallback_chain
  #
  # - name: bedrock
  #   type: bedrock
  #   region: ${AWS_REGION_NAME}
  #   access_key: ${AWS_ACCESS_KEY_ID}
  #   secret_key: ${AWS_SECRET_ACCESS_KEY}
  #   model: us.anthropic.claude-sonnet-4-6-20251001-v1:0
  #
  # - name: bedrock-haiku
  #   type: bedrock
  #   region: ${AWS_REGION_NAME}
  #   access_key: ${AWS_ACCESS_KEY_ID}
  #   secret_key: ${AWS_SECRET_ACCESS_KEY}
  #   model: us.anthropic.claude-haiku-4-5-20251001-v1:0

# Primary provider + fallback order.
# Order still matters: FallbackChain[0] is the primary provider; the rest are
# candidates that SortByTier()/RebuildChain() re-rank at runtime.
# Verified 2026-09-29 with POST /api/providers/test, after fixing the duplicated
# "/v1" path in internal/provider/openai.go:
#   respond    groq 51ms, apmix 6.3s, aihubmix 5.1s, dashscope 2.2s, tokenharbor
#              2.5s, openrouter 1.0s, cohere 337ms
#   transient  atessa (daily quota), minimax-m3 (provider quota), dahl
#              (free-tier concurrency), mistral + anyapi (429), gemini
#              (auto-discovery picks gemini-2.5-pro, not enabled for this key)
#   broken     (none — bedrock + bedrock-haiku disabled 2026-09-29, see above)
# 13 providers, all verified reachable except the documented transient ones.
fallback_chain: [groq, apmix, aihubmix, dashscope, atessa, minimax-m3, dahl, openrouter, mistral, cohere, gemini, tokenharbor, anyapi]

max_retries: 3
cooldown_seconds: 60

# Proxy server (set port > 0 to enable; then set ANTHROPIC_BASE_URL=http://localhost:8080)
proxy_port: 8080
proxy_log: true

# Budget for one /v1/messages request across the whole provider fallback chain.
# Must stay below the HTTP server WriteTimeout (180s) so a slow chain returns a
# readable JSON error instead of a truncated gateway response.
request_timeout_seconds: 90

# SQLite database path
db_path: orchestrator.db

# Worker pool concurrency
concurrency: 4

# Memory / knowledge-graph settings
memory_enabled: false       # set to true to inject retrieved context into system prompt
retrieval_k: 5              # max nodes to retrieve per query
core_memory_max_bytes: 4096 # max size of the core memory scratchpad
# Worker pool enabled at startup
enable_workers: true

# Tool sandboxing
tools:
  shell:
    timeout_seconds: 30
    allowed_commands: [git, go, npm, python, node, curl, cat, ls]
    deny_network: true
  web:
    timeout_seconds: 15
    max_response_bytes: 1048576

# Per-agent provider chains — each CLI agent routes through its own ordered list.
# Empty or missing entry falls back to the global fallback_chain.
agent_providers:
  codex:      [apmix, tokenharbor, aihubmix, mistral, dahl]
  cursor:     [apmix, tokenharbor, aihubmix, dashscope, dahl]
  cline:      [apmix, aihubmix, tokenharbor, mistral, dahl]
  opencode:   [apmix, tokenharbor, aihubmix, dashscope, dahl]
  grok:       [apmix, aihubmix, tokenharbor, groq, dahl]
  researcher: [apmix, tokenharbor, aihubmix, cohere, dahl]
  debugger:   [apmix, tokenharbor, aihubmix, groq, dahl]
  vibe:       [apmix, aihubmix, tokenharbor, dahl]
  jules:      [apmix, aihubmix, tokenharbor, gemini, dahl]
  agy:        [apmix, aihubmix, tokenharbor, dahl]
  kilo:       [apmix, tokenharbor, aihubmix, groq, dahl]
  hermes:     [apmix, aihubmix, tokenharbor, mistral, dahl]
  default:    [apmix, tokenharbor, aihubmix, dashscope, openrouter, dahl, groq]
# tokenharbor is back in the agent chains: its failures were caused by the
# duplicated "/v1" path (it answered an HTML 404 page), not by a dead service —
# verified working again on 2026-09-29.

# Available CLI agents — command overrides absolute binary path on server
# Agents without a command entry use the name looked up via PATH
cli_agents:
  # ── Confirmed working on server ──────────────────────────────────────────────
  - name: opencode
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/opencode
    description: "opencode run — free models incl. SuperBunny; own provider config"

  - name: codex
