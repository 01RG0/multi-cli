providers:
  - name: groq
    type: openai_compat
    base_url: https://api.groq.com/openai
    api_key: ${GROQ_API_KEY}
    model: qwen/qwen3.8-27b

  - name: tokenharbor
    type: openai_compat
    base_url: ${TOKEN_HARBOR_BASE_URL}
    api_key: ${TOKEN_HARBOR_API_KEY}
    model: gpt-4o-mini

  - name: codecraft
    type: openai_compat
    base_url: ${CODECRAFT_BASE_URL}
    api_key: ${CODECRAFT_API_KEY}
    model: gpt-4o-mini

  - name: aihubmix
    type: openai_compat
    base_url: ${AIHUBMIX_BASE_URL}
    api_key: ${AIHUBMIX_API_KEY}
    model: gpt-4o-mini

  - name: apmix
    type: openai_compat
    base_url: https://api.apmix.ai/v1
    api_key: ${APMIX_API_KEY}
    model: gpt-6-luna-free

  - name: dahl
    type: openai_compat
    base_url: https://inference.dahl.global/v1
    api_key: ${DAHL_API_KEY}
    model: deepseek-ai/DeepSeek-V4-Flash-0731

  - name: cerebras
    type: openai_compat
    base_url: https://api.cerebras.ai/v1
    api_key: ${CEREBRAS_API_KEY}
    model: llama-3.3-70b

  - name: mistral
    type: openai_compat
    base_url: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY}
    model: mistral-small-latest

  - name: openrouter
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model: meta-llama/llama-3.1-8b-instruct:free

  - name: cohere
    type: openai_compat
    base_url: https://api.cohere.ai/compatibility/v1
    api_key: ${COHERE_API_KEY}
    model: command-r

  - name: apertis
    type: openai_compat
    base_url: ${APERTIS_BASE_URL}
    api_key: ${APERTIS_API_KEY}
    model: gpt-4o-mini

  - name: atessa
    type: openai_compat
    base_url: ${ATESSA_BASE_URL}
    api_key: ${ATESSA_API_KEY}
    model: gpt-4o-mini

  - name: pooled
    type: openai_compat
    base_url: ${POOLED_BASE_URL}
    api_key: ${POOLED_API_KEY}
    model: gpt-4o-mini

  - name: anyapi
    type: openai_compat
    base_url: ${ANYAPI_BASE_URL}
    api_key: ${ANYAPI_API_KEY}
    model: gpt-4o-mini

  - name: dashscope
    type: openai_compat
    base_url: ${ALIBABA_BASE_URL}
    api_key: ${ALIBABA_API_KEY}
    model: qwen-plus

  - name: gemini
    type: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: ${GEMINI_API_KEY}
    model: gemini-2.0-flash

  - name: anthropic
    type: anthropic
    base_url: ""
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-opus-4-5

  - name: bedrock
    type: bedrock
    region: ${AWS_REGION_NAME}
    access_key: ${AWS_ACCESS_KEY_ID}
    secret_key: ${AWS_SECRET_ACCESS_KEY}
    model: us.anthropic.claude-sonnet-4-6-20251001-v1:0

# Primary provider + fallback order — free/cheap providers first; bedrock & anthropic only when all else fails
fallback_chain: [apmix, groq, dahl, cerebras, tokenharbor, aihubmix, codecraft, mistral, openrouter, apertis, atessa, pooled, anyapi, dashscope, cohere, gemini, bedrock, anthropic]

max_retries: 3
cooldown_seconds: 60

# Proxy server (set port > 0 to enable; then set ANTHROPIC_BASE_URL=http://localhost:8080)
proxy_port: 8080
proxy_log: false

# SQLite database path
db_path: orchestrator.db

# Worker pool concurrency
concurrency: 4

# Memory / knowledge-graph settings
memory_enabled: false       # set to true to inject retrieved context into system prompt
retrieval_k: 5              # max nodes to retrieve per query
core_memory_max_bytes: 4096 # max size of the core memory scratchpad
# Worker pool enabled at startup
enable_workers: true

# Tool sandboxing
tools:
  shell:
    timeout_seconds: 30
    allowed_commands: [git, go, npm, python, node, curl, cat, ls]
    deny_network: true
  web:
    timeout_seconds: 15
    max_response_bytes: 1048576

# Per-agent provider chains — each CLI agent routes through its own ordered list.
# Empty or missing entry falls back to the global fallback_chain.
agent_providers:
  codex:      [apmix, tokenharbor, aihubmix, mistral, dahl]
  cursor:     [apmix, tokenharbor, aihubmix, dashscope, dahl]
  cline:      [apmix, aihubmix, tokenharbor, mistral, dahl]
  opencode:   [apmix, tokenharbor, aihubmix, dashscope, dahl]
  grok:       [apmix, aihubmix, tokenharbor, groq, dahl]
  researcher: [apmix, tokenharbor, aihubmix, cohere, dahl]
  debugger:   [apmix, tokenharbor, aihubmix, groq, dahl]
  vibe:       [apmix, aihubmix, tokenharbor, cerebras, dahl]
  jules:      [apmix, aihubmix, tokenharbor, gemini, dahl]
  agy:        [apmix, aihubmix, tokenharbor, cerebras, dahl]
  kilo:       [apmix, tokenharbor, aihubmix, groq, dahl]
  hermes:     [apmix, tokenharbor, aihubmix, mistral, dahl]
  default:    [apmix, tokenharbor, aihubmix, dashscope, openrouter, dahl, groq, cerebras]

# Available CLI agents — command overrides absolute binary path on server
# Agents without a command entry use the name looked up via PATH
cli_agents:
  # ── Confirmed working on server ──────────────────────────────────────────────
  - name: opencode
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/opencode
    description: "Full-Stack Code Architect & AST Synthesizer"

  - name: codex
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/codex
    description: "Sandboxed Code Execution Engine (own OpenAI OAuth)"

  - name: cline
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/cline
    description: "Autonomous File System Refactorer"

  - name: kilo
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/kilo
    description: "Micro-Latency Token Optimizer (own free mode)"

  - name: kilocode
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/kilocode
    description: "KiloCode extended — multi-file code synthesis"

  - name: vibe
    command: /usr/local/bin/vibe
    description: "Rapid UI Prototyping (own Mistral key)"

  - name: agy
    command: /home/rootuser/.local/bin/agy
    description: "Autonomous Swarm Orchestration (own subscription)"

  - name: hermes
    command: /home/rootuser/.local/bin/hermes
    description: "Deep Tool-Use Reasoning & Autonomous Workflows"

  - name: researcher
    command: /home/rootuser/.local/bin/agy
    description: "Deep Documentation, Technical Extraction & Web Mining"

  - name: debugger
    command: /home/rootuser/.local/bin/agy
    description: "Stacktrace Diagnostics, Root-Cause Isolation & Fixer"

  # ── Newly installed ───────────────────────────────────────────────────────────
  - name: pi
    command: /usr/local/bin/pi
    description: "Pi terminal agent — pi --print (GROQ_API_KEY / CEREBRAS_API_KEY)"

  - name: kimocode
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/kimi
    description: "Kimi Code CLI — kimi -p (KIMI_API_KEY / MOONSHOT_API_KEY)"

  - name: jules
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/jules
    description: "Google Jules async cloud coding agent — jules new (needs google OAuth)"

  - name: deepseek
    command: /home/rootuser/.nvm/versions/node/v24.20.0/bin/dsh
    description: "DeepSeek Harness — dsh web (DeepSeek profile launcher)"

  # ── Pending / future install ──────────────────────────────────────────────────
  - name: grok
    command: grok
    description: "xAI Grok CLI — install pending"

  - name: cursor
    command: cursor
    description: "Cursor AI — GUI only, no headless mode"

  - name: harness
    command: harness
    description: "Harness AI Coding CLI — install pending"
