    model: deepseek-v4.1-flash:free
    # ✅ 2026-09-29: was only failing because of the duplicated "/v1" path — it
    # served an HTML 404 page. Verified working (2.5s) after that fix.

  - name: aihubmix
    type: openai_compat
    base_url: ${AIHUBMIX_BASE_URL}
    api_key: ${AIHUBMIX_API_KEY}
    model: nemotron-3-ultra-550b-a55b-free

  - name: apmix
    type: openai_compat
    base_url: https://api.apmix.ai/v1
    api_key: ${APMIX_API_KEY}
    model: deepseek-v4-flash-free

  - name: dahl
    type: openai_compat
    base_url: https://inference.dahl.global/v1
    api_key: ${DAHL_API_KEY}
    model: deepseek-ai/DeepSeek-V4-Flash-0731

  - name: mistral
    type: openai_compat
    base_url: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY}
    model: mistral-small-latest

  - name: openrouter
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model: deepseek/deepseek-v4.1-flash

  - name: cohere
    type: openai_compat
    base_url: https://api.cohere.ai/compatibility/v1
    api_key: ${COHERE_API_KEY}
    model: command-r7b-12-2024

  - name: atessa
    type: openai_compat
    base_url: ${ATESSA_BASE_URL}
    api_key: ${ATESSA_API_KEY}
    model: laguna-s-2.1

  - name: minimax-m3
    type: openai_compat
    base_url: ${POOLED_BASE_URL}
    api_key: ${POOLED_API_KEY}
    model: MiniMax-M3-Official

  # ⚠️ DISABLED 2026-09-29 — these two had no base_url / api_key, so every call
