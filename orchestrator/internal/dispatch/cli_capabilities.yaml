# ─── ROUTING MATRIX ─────────────────────────────────────────────────────────
routing:
  general_chat:
    primary: agy
    fallback: [hermes, pi, kilo]
    model_hint: "Gemini 3.8 Flash (Low)"
    reason: "agy fastest for Q&A; hermes for complex queries"

  web_research:
    primary: hermes
    fallback: [agy, gemini]
    reason: "hermes has browser-use; agy has Gemini web grounding; gemini native search"

  code_generation:
    primary: kilo
    fallback: [hermes, pi, agy]
    reason: "kilo purpose-built coding agent with repo context"

  code_review:
    primary: codex
    fallback: [hermes, kilo, pi]
    reason: "codex has dedicated code review mode"

  file_editing:
    primary: kilo
    fallback: [hermes, pi, cline]

  complex_autonomous:
    primary: hermes
    fallback: [kilo, cline]
    reason: "hermes richest toolset — delegation, memory, cron"

  browser_automation:
    primary: hermes
    fallback: [gemini]

  fast_cheap:
    primary: agy
    fallback: [pi, hermes]
    model_hint: "Gemini 3.8 Flash (Low)"

  reasoning_heavy:
    primary: agy
    fallback: [hermes, kilo]
    model_hint: "Claude Sonnet 4.6 (Thinking)"

  deepseek_code:
    primary: pi
    fallback: [hermes]
    model_hint: "deepseek-v3 via --provider deepseek"

  scheduling_cron:
    primary: hermes
    fallback: [agy]

# ─── CAPABILITY INDEX ────────────────────────────────────────────────────────
capability_index:
  working_now:     [agy, kilo, kilocode, pi, hermes]
  web_search:      [agy, hermes, gemini, dsh]
  browser_use:     [hermes]
  file_edit:       [kilo, kilocode, pi, hermes, cline, vibe, codex, dsh, grok, kimi, cursor_agent]
  code_execute:    [kilo, kilocode, pi, hermes, cline, vibe, dsh, kimi, cursor_agent]
  repo_context:    [kilo, kilocode, codex, cline, opencode, vibe, kimi, dsh]
  mcp_support:     [kilo, kilocode, hermes, codex, cline, opencode, gemini, vibe, kimi]
  memory:          [hermes, codex]
  cron_scheduling: [hermes]
  delegate_tasks:  [hermes]
  async_exec:      [jules]
  reasoning:       [agy, hermes]
  free_tier:       [agy, kilo, pi, hermes]

# Priority order for dispatch (higher = tried first)
dispatch_priority:
  - agy         # fast, versatile, confirmed working
  - hermes      # richest features, confirmed working
  - kilo        # best for code tasks
  - pi          # good fallback with multi-provider
  - kilocode    # same as kilo
  - codex       # review only (bwrap broken)
  - cline       # needs re-auth
  - gemini      # 503 issues
  - vibe        # headless issues
  - opencode    # not in PATH
  - kimi        # no API key
  - dsh         # no profile
  - cursor_agent  # no key
  - grok        # broken (keytar)
  - jules       # needs login (async)
